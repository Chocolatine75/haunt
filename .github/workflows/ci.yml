name: CI

on:
  push:
    branches: [master, v2]
  pull_request:

jobs:
  check-versions:
    name: check-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-versions.mjs

  mcp-server:
    name: mcp-server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three systems when the change is headed for v2 or master (a
        # part's PR, or a push to those branches). A sub-PR into a part branch
        # only runs macOS, to keep the loop short; the other two are checked
        # when the part itself goes to v2.
        os: ${{ fromJSON((github.event_name == 'push' || github.base_ref == 'v2' || github.base_ref == 'master') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["macos-latest"]') }}
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:coverage
      - run: npm run build
