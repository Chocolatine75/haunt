name: CI

on:
  push:
    branches: [master, v2]
  pull_request:

jobs:
  check-versions:
    name: check-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-versions.mjs

  mcp-server:
    name: mcp-server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run macOS only, to keep the loop short. Linux and
        # Windows run when the change lands: on a push to v2 or master. A PR
        # whose branch name ends in "-all-os" runs all three, for changes
        # that are about one of the other systems.
        os: ${{ fromJSON((github.event_name == 'push' || endsWith(github.head_ref, '-all-os')) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["macos-latest"]') }}
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      # Windows runners ran out of breath with one test file per core, each
      # with its own Chromium: a different test fell over on each run after
      # part 2 (a socket error loading a script, a browser that took more
      # than 10 s to close, a 3 s "long task" while typing). Two at a time
      # there; the tests and their limits are the same everywhere.
      - run: npx vitest run --coverage ${{ matrix.os == 'windows-latest' && '--maxWorkers=2' || '' }}
      # Time budgets, reported but not enforced here: shared runners vary by
      # a factor of two from one run to the next (the same test took 14 s and
      # 34 s on Windows a few hours apart), so a failure would say nothing
      # about the code. `npm run check` enforces them locally.
      - run: npm run test:perf
        continue-on-error: true
      - run: npm run build
