<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gauntlet — editors</title>
<link rel="stylesheet" href="/_g.css">
<script src="/_g.js"></script>
<style>
  #rich { min-height: 80px; width: 420px; padding: 8px; border: 1px solid #888; }
  #code { position: relative; width: 420px; height: 110px; border: 1px solid #888; font: 13px/18px monospace; }
  #code pre { margin: 0; padding: 6px; white-space: pre-wrap; pointer-events: none; }
  /* The real input is an invisible textarea laid over the rendered code. */
  #code textarea { position: absolute; inset: 0; width: 100%; height: 100%; padding: 6px; box-sizing: border-box; border: 0; opacity: 0; resize: none; font: inherit; }
</style>
</head>
<body>
<h1>Editors</h1>

<section>
  <h2>Rich text (contenteditable)</h2>
  <div class="toolbar">
    <button data-g="bold" type="button" aria-pressed="false">Bold</button>
  </div>
  <div id="rich" data-g="rich" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Message"></div>
</section>

<section>
  <h2>Code editor (hidden textarea under rendered text)</h2>
  <div id="code">
    <pre id="code-view" aria-hidden="true"></pre>
    <textarea data-g="code" aria-label="Source code" spellcheck="false"></textarea>
  </div>
</section>

<section>
  <h2>Canvas with one accessible control</h2>
  <canvas id="canvas" width="420" height="120" aria-label="Chart">
    <button data-g="canvas-reset" type="button">Reset zoom</button>
  </canvas>
</section>
<p id="result" role="status"></p>

<script>
  const G = window.__gauntlet;
  const say = (text) => { document.getElementById('result').textContent = text; };

  const rich = G.find('rich');
  G.state.rich = '';
  rich.addEventListener('input', () => { G.state.rich = rich.innerText; });
  G.find('bold').addEventListener('click', (e) => {
    const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', String(on));
    rich.style.fontWeight = on ? 'bold' : 'normal';
  });

  const code = G.find('code');
  const view = document.getElementById('code-view');
  G.state.code = '';
  code.addEventListener('input', () => {
    view.textContent = code.value;
    G.state.code = code.value;
  });

  // The canvas draws a "Reset zoom" button in its top-right corner; the
  // fallback <button> is what assistive tech (and a DOM-based tool) sees.
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f4f4f4';
  ctx.fillRect(0, 0, 420, 120);
  ctx.fillStyle = '#36c';
  ctx.fillRect(310, 10, 100, 30);
  ctx.fillStyle = '#fff';
  ctx.font = '13px sans-serif';
  ctx.fillText('Reset zoom', 325, 30);
  G.state.zoomResets = 0;
  const reset = (via) => {
    G.state.zoomResets++;
    G.record('reset', 'canvas', via);
    say('Zoom reset');
  };
  canvas.addEventListener('click', (e) => {
    const box = canvas.getBoundingClientRect();
    const x = e.clientX - box.left;
    const y = e.clientY - box.top;
    if (x >= 310 && x <= 410 && y >= 10 && y <= 40) reset('pointer');
  });
  G.find('canvas-reset').addEventListener('click', (e) => {
    e.stopPropagation();
    reset('button');
  });
</script>
</body>
</html>
