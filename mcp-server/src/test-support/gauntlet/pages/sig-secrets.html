<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gauntlet — sig-secrets</title>
<link rel="stylesheet" href="/_g.css">
<script src="/_g.js"></script>
</head>
<body>
<!--
  Every failure here carries what was typed into the password field: in a
  query string, in a path, in an error message, in a stack frame, in a
  console line, in a rejection. The clean variant sends the same requests
  and they succeed.
-->
<h1>Secrets</h1>
<p><label>Password <input data-g="password" type="password" name="password" autocomplete="current-password"></label></p>

<p><button data-g="in-query" type="button">Sign in</button></p>
<p><button data-g="in-path" type="button">Reset</button></p>
<p><button data-g="in-message" type="button">Check strength</button></p>
<!-- The message is harmless; the secret is the name of a function on the stack. -->
<p><button data-g="in-stack" type="button">Derive key</button></p>
<p><button data-g="in-console" type="button">Debug</button></p>
<p><button data-g="in-rejection" type="button">Rotate</button></p>
<p id="result" role="status"></p>

<script>
  const G = window.__gauntlet;
  const BUGGY = '{{VARIANT}}' === 'buggy';
  const say = (text) => { document.getElementById('result').textContent = text; };
  const secret = () => G.find('password').value;

  G.find('in-query').addEventListener('click', async () => {
    const res = await fetch(`/sig/api/session?variant={{VARIANT}}&token=${encodeURIComponent(secret())}`);
    say(res.ok ? 'Signed in' : 'Sign-in failed');
  });
  G.find('in-path').addEventListener('click', async () => {
    const res = await fetch(`/sig/api/reset/${encodeURIComponent(secret())}?variant={{VARIANT}}`);
    say(res.ok ? 'Reset sent' : 'Reset failed');
  });
  G.find('in-message').addEventListener('click', () => {
    if (BUGGY) throw new Error(`Password "${secret()}" is too weak`);
    say('Strong enough');
  });
  G.find('in-stack').addEventListener('click', () => {
    const name = secret();
    const steps = {
      [name]() {
        if (BUGGY) throw new Error('Key derivation failed');
        say('Key derived');
      },
    };
    steps[name]();
  });
  G.find('in-console').addEventListener('click', () => {
    if (BUGGY) console.error(`login failed with password ${secret()}`);
    else say('Nothing to report');
  });
  G.find('in-rejection').addEventListener('click', () => {
    if (BUGGY) Promise.reject(new Error(`Token ${secret()} was refused`));
    else say('Rotated');
  });
</script>
</body>
</html>
