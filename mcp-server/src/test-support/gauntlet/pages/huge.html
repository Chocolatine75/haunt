<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gauntlet — huge</title>
<link rel="stylesheet" href="/_g.css">
<script src="/_g.js"></script>
<style>
  .record { display: flex; gap: 8px; align-items: center; height: 26px; }
  .record span { font-size: 12px; }
</style>
</head>
<body>
<h1>Huge page</h1>
<!-- 500 records × 4 controls = 2,000 interactive elements, and 500 × 40
     text spans = 20,000 text nodes. Rendered by the server (server.ts):
     built by a script in one go they made a 600 to 900 ms task while the
     page loaded, a long task the page did not mean to plant (S5.4 on the
     Linux runner); parsed, the browser takes them in short pieces. -->
<div id="records">{{HUGE_RECORDS}}</div>
<p id="result" role="status"></p>

<script>
  const G = window.__gauntlet;
  const records = document.getElementById('records');
  G.state.clicks = 0;

  records.addEventListener('click', (e) => {
    const el = e.target.closest('[data-g]');
    if (!el) return;
    G.state.clicks++;
    if (el.tagName === 'BUTTON') {
      document.getElementById('result').textContent = `Archived ${el.dataset.g.replace('archive-', 'record ')}`;
    }
  });
</script>
</body>
</html>
